name: FOX Backtest Regression
on:
  push:
    paths:
      - 'modules/validation/fox_backtest.py'
      - 'modules/validation/test_fox_backtest.py'
      - 'modules/validation/fox_data_audit.py'
      - 'modules/validation/test_fox_data_audit.py'
      - 'modules/validation/fox_nse_import.py'
      - 'modules/validation/test_fox_nse_import.py'
      - 'modules/decision/fox_add_engine.py'
      - 'modules/decision/test_fox_add_engine.py'
      - '.github/workflows/fox-backtest-tests.yml'
  pull_request:
    paths:
      - 'modules/validation/**'
      - 'modules/decision/fox_add_engine.py'
      - 'modules/decision/test_fox_add_engine.py'
      - '.github/workflows/fox-backtest-tests.yml'
  workflow_dispatch:

jobs:
  fox-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run FOX point-in-time regression tests
        run: python -m unittest modules.validation.test_fox_backtest modules.validation.test_fox_data_audit modules.validation.test_fox_nse_import modules.decision.test_fox_add_engine -v
